name: Native MeadowOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meadowos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified secret scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir /tmp/gitleaks
          cd /tmp/gitleaks
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan full public history with redacted output
        run: /tmp/gitleaks/gitleaks git . --redact=100 --no-banner --log-opts="--all"
  onboarding:
    needs: credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute native API setup and conversation integration
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test -tags meadow_vm_lab ./core/runtimecontrol ./core/agentdaemon
      - name: Offline build, transport and hidden-input contracts
        env:
          PYTHONPATH: scripts/meadowos:docker
        run: |
          python3 -m unittest scripts/meadowos/test_foundation.py \
            scripts/meadowos/test_archive_provenance.py docker/test_companion_proxy.py \
            scripts/meadowos/test_shell_agent_client.py scripts/meadowos/test_configure_inception.py
  desktop:
    needs: credentials
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and exercise a fresh native desktop
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          MEADOW_SMOKE_ARTIFACTS: ${{ github.workspace }}/artifacts/native-${{ matrix.arch }}
        run: bash docker/smoke.sh
      - name: Upload clean native screenshots and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meadowos-native-${{ matrix.arch }}
          path: artifacts/native-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 14
