# Experimental only: MEADOW_EXPERIMENTAL_GLASS=1. Default session uses xfwm4 alpha.
# GLX hidden-window first-map acceptance is not complete; never enable by default.
# In experimental mode the session starts xfwm4 with compositing disabled and owns this
# compositor. GLX also runs on Mesa's software renderer in a guest without a GPU.
# XRender was rejected: GTK caret/hover updates left rectangular blur holes.
backend = "glx";
vsync = false;
use-damage = true;
fading = false;
unredir-if-possible = false;

# Native per-pixel alpha only. Do not lower whole-window opacity: text and
# ordinary applications must retain their original opacity and contrast.
blur-background = true;
blur-background-fixed = true;
blur-background-exclude = [
  "class_i != 'meadow-shell'",
  "window_type = 'desktop'"
];
blur: { method = "gaussian"; size = 18; deviation = 9.0; };

shadow = true;
shadow-radius = 24;
shadow-opacity = 0.16;
shadow-offset-x = -24;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'desktop'",
  "name = 'MeadowOS System Bar'",
  "class_i != 'meadow-shell' && window_type != 'normal' && window_type != 'dialog'"
];
# Ordinary applications retain soft depth after xfwm's compositor is disabled.
# Shell surfaces use their larger radius; app titlebars/content remain native.
corner-radius = 12;
corner-radius-rules = [
  "18:class_i = 'meadow-shell' && window_type != 'desktop' && name != 'MeadowOS System Bar'"
];
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "name = 'MeadowOS System Bar'",
  "class_i != 'meadow-shell' && window_type != 'normal' && window_type != 'dialog'"
];
