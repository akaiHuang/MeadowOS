<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>霓虹貪食蛇</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f4f7ff;
        --muted: #9aa5bd;
        --panel: #111827;
        --line: #263247;
        --mint: #54e6b3;
        --pink: #ff5b8d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(12px, 3vw, 32px);
        color: var(--ink);
        background: radial-gradient(
          circle at 20% 0%,
          #24315a 0,
          #0a0f1f 42%,
          #050812 100%
        );
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main {
        width: min(94vw, 660px);
        padding: clamp(16px, 3vw, 28px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgb(9 14 27 / 0.88);
        box-shadow: 0 24px 70px rgb(0 0 0 / 0.45);
      }
      header,
      .stats,
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 5vw, 2.25rem);
        letter-spacing: 0.06em;
      }
      .stats {
        color: var(--muted);
        margin: 14px 0;
      }
      .stats strong {
        color: var(--mint);
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid #344158;
        border-radius: 16px;
        background: #08111f;
        touch-action: none;
      }
      button {
        min-height: 44px;
        border: 1px solid #35425a;
        border-radius: 12px;
        padding: 10px 16px;
        color: var(--ink);
        background: #172033;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--mint);
        outline: none;
      }
      .actions {
        margin-top: 14px;
      }
      .touch-controls {
        width: min(230px, 100%);
        margin: 18px auto 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .touch-controls button {
        font-size: 1.25rem;
        padding: 8px;
      }
      .touch-controls [data-dir='up'] {
        grid-column: 2;
      }
      .touch-controls [data-dir='left'] {
        grid-column: 1;
        grid-row: 2;
      }
      .touch-controls [data-dir='down'] {
        grid-column: 2;
        grid-row: 2;
      }
      .touch-controls [data-dir='right'] {
        grid-column: 3;
        grid-row: 2;
      }
      #status {
        min-height: 1.4em;
        color: var(--pink);
        text-align: center;
        margin: 12px 0 0;
      }
      .hint {
        color: var(--muted);
        font-size: 0.8rem;
      }
      @media (min-width: 720px) and (pointer: fine) {
        .touch-controls {
          opacity: 0.78;
        }
      }
      @media (max-width: 480px) {
        main {
          border-radius: 16px;
          padding: 14px;
        }
        .hint {
          display: none;
        }
        .actions button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>NEON SNAKE</h1>
        <span class="hint">方向鍵 / WASD · Space 暫停 · R 重玩</span>
      </header>
      <div class="stats">
        <span>分數 <strong id="score">0</strong></span>
        <span>最高分 <strong id="highScore">0</strong></span>
        <span>等級 <strong id="level">1</strong></span>
      </div>
      <canvas
        id="game"
        width="480"
        height="480"
        aria-label="貪食蛇遊戲區"
      ></canvas>
      <p id="status" role="status">按方向鍵或觸控按鈕開始</p>
      <div class="actions">
        <button id="pauseButton" type="button">暫停</button>
        <button id="restartButton" type="button">重新開始</button>
      </div>
      <div class="touch-controls" aria-label="Touch controls">
        <button type="button" data-dir="up" aria-label="向上">▲</button>
        <button type="button" data-dir="left" aria-label="向左">◀</button>
        <button type="button" data-dir="down" aria-label="向下">▼</button>
        <button type="button" data-dir="right" aria-label="向右">▶</button>
      </div>
    </main>
    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreElement = document.getElementById('score');
      const highScoreElement = document.getElementById('highScore');
      const levelElement = document.getElementById('level');
      const statusElement = document.getElementById('status');
      const pauseButton = document.getElementById('pauseButton');
      const restartButton = document.getElementById('restartButton');
      const COLS = 24;
      const CELL = canvas.width / COLS;

      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let level;
      let speed;
      let paused;
      let started;
      let gameOver;
      let timer;
      let highScore = Number(localStorage.getItem('snakeHighScore') || 0);
      highScoreElement.textContent = highScore;

      function randomFood() {
        let candidate;
        do {
          candidate = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * COLS),
          };
        } while (
          snake.some((part) => part.x === candidate.x && part.y === candidate.y)
        );
        return candidate;
      }

      function resetGame() {
        clearTimeout(timer);
        snake = [
          { x: 12, y: 12 },
          { x: 11, y: 12 },
          { x: 10, y: 12 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        level = 1;
        speed = 130;
        paused = false;
        started = false;
        gameOver = false;
        food = randomFood();
        scoreElement.textContent = score;
        levelElement.textContent = level;
        pauseButton.textContent = '暫停';
        statusElement.textContent = '按方向鍵或觸控按鈕開始';
        draw();
      }

      function setDirection(x, y) {
        if (gameOver) return;
        if (x === -direction.x && y === -direction.y) return;
        nextDirection = { x, y };
        if (!started) {
          started = true;
          statusElement.textContent = '';
          scheduleTick();
        }
      }

      function togglePause() {
        if (gameOver || !started) return;
        paused = !paused;
        pauseButton.textContent = paused ? '繼續' : '暫停';
        statusElement.textContent = paused ? '遊戲暫停' : '';
        if (!paused) scheduleTick();
        else clearTimeout(timer);
      }

      function scheduleTick() {
        clearTimeout(timer);
        if (!paused && !gameOver && started) timer = setTimeout(tick, speed);
      }

      function tick() {
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };
        const hitWall =
          head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= COLS;
        const hitSnake = snake.some(
          (part) => part.x === head.x && part.y === head.y,
        );
        if (hitWall || hitSnake) {
          gameOver = true;
          statusElement.textContent = '遊戲結束 · 按 R 或重新開始';
          draw();
          return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          level = 1 + Math.floor(score / 50);
          speed = Math.max(45, 130 - (level - 1) * 9);
          scoreElement.textContent = score;
          levelElement.textContent = level;
          if (score > highScore) {
            highScore = score;
            highScoreElement.textContent = highScore;
            localStorage.setItem('snakeHighScore', String(highScore));
          }
          food = randomFood();
        } else {
          snake.pop();
        }
        draw();
        scheduleTick();
      }

      function drawCell(point, color, inset = 2) {
        ctx.fillStyle = color;
        ctx.fillRect(
          point.x * CELL + inset,
          point.y * CELL + inset,
          CELL - inset * 2,
          CELL - inset * 2,
        );
      }

      function draw() {
        ctx.fillStyle = '#08111f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,.035)';
        for (let i = 1; i < COLS; i += 1) {
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }
        drawCell(food, '#ff5b8d', 3);
        snake.forEach((part, index) =>
          drawCell(part, index === 0 ? '#9affdb' : '#54e6b3'),
        );
        if (paused || gameOver) {
          ctx.fillStyle = 'rgba(3,7,18,.52)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      }

      document.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        const moves = {
          arrowup: [0, -1],
          w: [0, -1],
          arrowdown: [0, 1],
          s: [0, 1],
          arrowleft: [-1, 0],
          a: [-1, 0],
          arrowright: [1, 0],
          d: [1, 0],
        };
        if (moves[key]) {
          event.preventDefault();
          setDirection(...moves[key]);
        }
        if (event.code === 'Space') {
          event.preventDefault();
          togglePause();
        }
        if (key === 'r') resetGame();
      });
      document.querySelectorAll('[data-dir]').forEach((button) => {
        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          const moves = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          };
          setDirection(...moves[button.dataset.dir]);
        });
      });
      pauseButton.addEventListener('click', togglePause);
      restartButton.addEventListener('click', resetGame);
      resetGame();
    </script>
  </body>
</html>
