<!doctype html>
<html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf3fa;font:16px/1.5 system-ui,sans-serif}main{width:min(720px,100%);margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;letter-spacing:-.04em;margin:0}p{color:#a6b6c9}button,input,textarea,select{font:inherit}button{border:1px solid #425169;background:#233046;color:inherit;border-radius:10px;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #72dfd3}button:hover{background:#33445e}.primary{background:#71dfcd;color:#102720;border-color:transparent}.primary:hover{background:#98efde;color:#102720}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#111b2b;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;margin:16px 0;flex-wrap:wrap}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:14px auto}.controls button{padding:12px}.controls [data-dir=up]{grid-column:2}.controls [data-dir=left]{grid-column:1}.muted{color:#9aaec4;font-size:14px}#message{min-height:26px;color:#71dfcd}.scoreboard{margin:18px 0;padding:14px;border:1px solid #425169;border-radius:12px}.scoreboard ol{margin:8px 0;padding-left:24px}@media(max-width:500px){main{padding:16px}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style>
<main id="app"><header><h1>MAZE / 01</h1><button id="fullscreen">全螢幕</button></header><p>收集豆子，避開四隻幽靈；能量豆讓幽靈暫時可被吃掉。</p><div class="bar"><span>分數 <b id="score">0</b></span><span>生命 <b id="lives">3</b></span><span>豆子 <b id="remaining">0</b></span></div><canvas id="game" width="600" height="600" aria-label="迷宮吃豆遊戲"></canvas><div class="bar"><button class="primary" id="start">開始</button><button id="pause">暫停</button><button id="restart">重新開始</button></div><div id="message" role="status"></div><div class="controls"><button data-dir="up" aria-label="上">↑</button><button data-dir="left" aria-label="左">←</button><button data-dir="down" aria-label="下">↓</button><button data-dir="right" aria-label="右">→</button></div><p class="muted">方向鍵 / WASD · P 暫停 · R 重開 · F 全螢幕。手機可按方向鍵或在棋盤滑動。</p></main>
<script>
"use strict";
// Cell coordinates: x increases right, y increases down; all entities occupy legal cells.
const map=["###############","#o...........o#","#.###.###.###.#","#.............#","#.###.#.#.###.#","#.....#.#.....#","###.#.....#.###","#...#.#.#.#...#","#.#.......#.#.#","#.#.#.###.#.#.#","#...#.....#...#","#.###.#.#.###.#","#.....#.#.....#","#o...........o#","###############"];
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=15,S=40;
const dirs={up:[0,-1],left:[-1,0],down:[0,1],right:[1,0]},colors=['#ff7c91','#6fc7ff','#ffa95f','#d49fff'];
let state,acc=0,manual=false,last=performance.now(),sequence=0;
const legal=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&map[y][x]!=='#';
const home=[{x:7,y:6},{x:8,y:6},{x:7,y:8},{x:8,y:8}];
function spawn(){state.player={x:1,y:1,dir:'right',want:'right'};state.ghosts=home.map((p,i)=>({...p,color:colors[i],dir:'left',id:i}));state.invincible=10;}
function reset(){state={mode:'ready',score:0,lives:3,power:0,tick:0,pellets:[],ghosts:[],player:null};for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]==='.'||map[y][x]==='o')state.pellets.push({x,y,power:map[y][x]==='o'});spawn();acc=0;sequence=0;draw();}
function emit(){dispatchEvent(new CustomEvent('game-score',{detail:{score:state.score,finished:['won','lost'].includes(state.mode)}}));}
function consume(){const i=state.pellets.findIndex(p=>p.x===state.player.x&&p.y===state.player.y);if(i<0)return;const p=state.pellets.splice(i,1)[0];state.score+=p.power?50:10;if(p.power)state.power=55;emit();if(!state.pellets.length){state.mode='won';emit();}}
function start(){if(['won','lost'].includes(state.mode))reset();state.mode='playing';consume();draw();}
function pause(){if(state.mode==='playing')state.mode='paused';else if(state.mode==='paused')state.mode='playing';draw();}
function choose(d){if(!dirs[d])return;state.player.want=d;if(state.mode==='ready')start();}
function distance(a,b){const queue=[a],seen=new Set([a.x+','+a.y]);for(let i=0;i<queue.length;i++){const p=queue[i];if(p.x===b.x&&p.y===b.y)return p.d||0;for(const [dx,dy]of Object.values(dirs)){const x=p.x+dx,y=p.y+dy,k=x+','+y;if(legal(x,y)&&!seen.has(k)){seen.add(k);queue.push({x,y,d:(p.d||0)+1});}}}return 999;}
function collide(previous){if(state.invincible>0)return;for(const g of state.ghosts){const same=g.x===state.player.x&&g.y===state.player.y;const crossing=previous&&g.oldX===state.player.x&&g.oldY===state.player.y&&g.x===previous.x&&g.y===previous.y;if(!same&&!crossing)continue;if(state.power>0){state.score+=200;g.x=home[g.id].x;g.y=home[g.id].y;emit();}else{state.lives--;if(state.lives===0){state.mode='lost';emit();}else spawn();return;}}}
function step(){if(state.mode!=='playing')return;state.tick++;state.power=Math.max(0,state.power-1);state.invincible=Math.max(0,state.invincible-1);const p=state.player,previous={x:p.x,y:p.y};let [dx,dy]=dirs[p.want];if(legal(p.x+dx,p.y+dy))p.dir=p.want;[dx,dy]=dirs[p.dir];if(legal(p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy;}consume();collide(null);if(state.mode!=='playing')return;if(state.tick%2===0)for(const g of state.ghosts){g.oldX=g.x;g.oldY=g.y;const options=Object.entries(dirs).map(([d,[a,b]])=>({d,x:g.x+a,y:g.y+b})).filter(q=>legal(q.x,q.y));const reverse={up:'down',down:'up',left:'right',right:'left'}[g.dir];const forward=options.filter(q=>q.d!==reverse);const candidates=forward.length?forward:options;const target=state.power?{x:p.x,y:p.y}:(g.id%2?{x:13,y:13}:p);candidates.sort((a,b)=>(state.power?-1:1)*(distance(a,target)-distance(b,target)));const choice=candidates[(state.tick+g.id)%7===0&&candidates.length>1?1:0];g.x=choice.x;g.y=choice.y;g.dir=choice.d;}collide(previous);}
function advance(ms){if(!Number.isFinite(ms)||ms<0)return;acc+=Math.min(ms,60000);while(acc>=140){step();acc-=140;}draw();}
function draw(){ctx.fillStyle='#111b2b';ctx.fillRect(0,0,600,600);for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(map[y][x]==='#'){ctx.fillStyle='#274a75';ctx.fillRect(x*S+3,y*S+3,S-6,S-6);}for(const p of state.pellets){ctx.fillStyle=p.power?'#71dfcd':'#e7d8af';ctx.beginPath();ctx.arc((p.x+.5)*S,(p.y+.5)*S,p.power?7:3,0,Math.PI*2);ctx.fill();}const p=state.player,a={right:0,down:Math.PI/2,left:Math.PI,up:-Math.PI/2}[p.dir];ctx.fillStyle=state.invincible>0?'#fff3a4':'#ffd151';ctx.beginPath();ctx.moveTo((p.x+.5)*S,(p.y+.5)*S);ctx.arc((p.x+.5)*S,(p.y+.5)*S,15,a+.24,a+Math.PI*2-.24);ctx.closePath();ctx.fill();for(const g of state.ghosts){ctx.fillStyle=state.power?'#566ff0':g.color;ctx.beginPath();ctx.arc((g.x+.5)*S,(g.y+.5)*S,14,Math.PI,0);ctx.lineTo((g.x+.5)*S+14,(g.y+.5)*S+14);ctx.lineTo((g.x+.5)*S-14,(g.y+.5)*S+14);ctx.fill();ctx.fillStyle='white';for(const off of [-5,5]){ctx.beginPath();ctx.arc((g.x+.5)*S+off,(g.y+.5)*S,3,0,7);ctx.fill();}}document.querySelector('#score').textContent=state.score;document.querySelector('#lives').textContent=state.lives;document.querySelector('#remaining').textContent=state.pellets.length;document.querySelector('#message').textContent={ready:'準備好了嗎？',playing:state.power?'能量模式':'',paused:'已暫停',won:'全部收集完成！',lost:'遊戲結束，試試重新開始。'}[state.mode];document.querySelector('#pause').textContent=state.mode==='paused'?'繼續':'暫停';}
function snapshot(){return {mode:state.mode,score:state.score,lives:state.lives,power:state.power,tick:state.tick,player:{...state.player},ghosts:state.ghosts.map(g=>({...g})),remaining:state.pellets.length,pellets:state.pellets.map(p=>({...p})),map,coordinates:'integer grid, origin top-left; x right, y down'};}
window.render_game_to_text=()=>JSON.stringify(snapshot());window.advanceTime=ms=>{manual=true;advance(ms)};window.meadowTest={getState:snapshot};
document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=reset;for(const b of document.querySelectorAll('[data-dir]'))b.onclick=()=>choose(b.dataset.dir);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#app').requestFullscreen();}catch(e){document.querySelector('#message').textContent='此瀏覽器不支援全螢幕';}}
document.querySelector('#fullscreen').onclick=fullscreen;
addEventListener('keydown',e=>{const key=e.key.toLowerCase(),d={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[key];if(d){e.preventDefault();choose(d)}else if(key==='p')pause();else if(key==='r')reset();else if(key==='f')fullscreen();else if(key==='enter'||key===' '){e.preventDefault();start();}});
let touch=null;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>12)choose(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touch=null;});
function loop(now){if(!manual)advance(Math.min(100,now-last));last=now;requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);

</script></html>
