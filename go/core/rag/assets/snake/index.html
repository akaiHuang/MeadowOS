<!doctype html>
<html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake arcade</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf3fa;font:16px/1.5 system-ui,sans-serif}main{width:min(720px,100%);margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;letter-spacing:-.04em;margin:0}p{color:#a6b6c9}button,input,textarea,select{font:inherit}button{border:1px solid #425169;background:#233046;color:inherit;border-radius:10px;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #72dfd3}button:hover{background:#33445e}.primary{background:#71dfcd;color:#102720;border-color:transparent}.primary:hover{background:#98efde;color:#102720}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#111b2b;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;margin:16px 0;flex-wrap:wrap}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:14px auto}.controls button{padding:12px}.controls [data-dir=up]{grid-column:2}.controls [data-dir=left]{grid-column:1}.muted{color:#9aaec4;font-size:14px}#message{min-height:26px;color:#71dfcd}.scoreboard{margin:18px 0;padding:14px;border:1px solid #425169;border-radius:12px}.scoreboard ol{margin:8px 0;padding-left:24px}@media(max-width:500px){main{padding:16px}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style>
<main id="app"><header><h1>SNAKE / 02</h1><button id="fullscreen">全螢幕</button></header><p>每顆食物增加 10 分。轉彎不可直接反向，碰到牆壁或身體即結束。</p><div class="bar"><span>分數 <b id="score">0</b></span><span id="message" role="status">準備開始</span></div><canvas id="game" width="600" height="600" aria-label="貪食蛇"></canvas><div class="bar"><button class="primary" id="start">開始</button><button id="pause">暫停</button><button id="restart">重新開始</button></div><div class="controls"><button data-dir="up">↑</button><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p class="muted">方向鍵 / WASD · P 暫停 · R 重開 · F 全螢幕。支援手機滑動。</p></main>
<script>
"use strict";
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=20,S=30,dirs={right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]};let state,acc=0,manual=false,last=performance.now();
function food(){const occupied=new Set(state.snake.map(p=>p.x+','+p.y));let cells=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!occupied.has(x+','+y))cells.push({x,y});state.food=cells.length?cells[(state.seed++*113)%cells.length]:null;}
function reset(){state={mode:'ready',score:0,dir:'right',want:'right',snake:[{x:5,y:10},{x:4,y:10},{x:3,y:10}],food:{x:8,y:10},seed:1,tick:0};acc=0;draw();}
function emit(){dispatchEvent(new CustomEvent('game-score',{detail:{score:state.score,finished:state.mode==='lost'||state.mode==='won'}}));}
function start(){if(['lost','won'].includes(state.mode))reset();state.mode='playing';draw();}
function pause(){if(state.mode==='playing')state.mode='paused';else if(state.mode==='paused')state.mode='playing';draw();}
function choose(d){if(!dirs[d])return;const [a,b]=dirs[state.dir],[x,y]=dirs[d];if(x!==-a||y!==-b)state.want=d;if(state.mode==='ready')start();}
function step(){if(state.mode!=='playing')return;state.tick++;state.dir=state.want;const [dx,dy]=dirs[state.dir],head={x:state.snake[0].x+dx,y:state.snake[0].y+dy};const eats=state.food&&head.x===state.food.x&&head.y===state.food.y;const body=eats?state.snake:state.snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){state.mode='lost';emit();return;}state.snake.unshift(head);if(eats){state.score+=10;food();if(!state.food)state.mode='won';emit();}else state.snake.pop();}
function advance(ms){if(!Number.isFinite(ms)||ms<0)return;acc+=Math.min(ms,60000);while(acc>=150){step();acc-=150;}draw();}
function draw(){ctx.fillStyle='#111b2b';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#202e41';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,600);ctx.moveTo(0,i*S);ctx.lineTo(600,i*S);ctx.stroke();}if(state.food){ctx.fillStyle='#ff917e';ctx.beginPath();ctx.arc((state.food.x+.5)*S,(state.food.y+.5)*S,10,0,7);ctx.fill();}state.snake.forEach((p,i)=>{ctx.fillStyle=i?'#3d998a':'#71dfcd';ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)});document.querySelector('#score').textContent=state.score;document.querySelector('#message').textContent={ready:'準備開始',playing:'',paused:'已暫停',lost:'遊戲結束',won:'棋盤完成！'}[state.mode];document.querySelector('#pause').textContent=state.mode==='paused'?'繼續':'暫停';}
function snapshot(){return JSON.parse(JSON.stringify({...state,coordinates:'integer grid, origin top-left, x right/y down'}));}window.render_game_to_text=()=>JSON.stringify(snapshot());window.advanceTime=ms=>{manual=true;advance(ms)};window.meadowTest={getState:snapshot};
document.querySelector('#start').onclick=start;document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=reset;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>choose(b.dataset.dir));async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#app').requestFullscreen();}catch(e){document.querySelector('#message').textContent='此瀏覽器不支援全螢幕';}}document.querySelector('#fullscreen').onclick=fullscreen;addEventListener('keydown',e=>{const key=e.key.toLowerCase(),d={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[key];if(d){e.preventDefault();choose(d)}else if(key==='p')pause();else if(key==='r')reset();else if(key==='f')fullscreen();else if(key==='enter'||key===' '){e.preventDefault();start()}});
let touch;canvas.onpointerdown=e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=e=>{if(!touch)return;const x=e.clientX-touch.x,y=e.clientY-touch.y;if(Math.max(Math.abs(x),Math.abs(y))>12)choose(Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up'));touch=null;};function loop(now){if(!manual)advance(Math.min(100,now-last));last=now;requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);

</script></html>
