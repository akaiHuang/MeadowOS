<!doctype html>
<html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作看板</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf3fa;font:16px/1.5 system-ui,sans-serif}main{width:min(720px,100%);margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;letter-spacing:-.04em;margin:0}p{color:#a6b6c9}button,input,textarea,select{font:inherit}button{border:1px solid #425169;background:#233046;color:inherit;border-radius:10px;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #72dfd3}button:hover{background:#33445e}.primary{background:#71dfcd;color:#102720;border-color:transparent}.primary:hover{background:#98efde;color:#102720}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#111b2b;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;margin:16px 0;flex-wrap:wrap}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:14px auto}.controls button{padding:12px}.controls [data-dir=up]{grid-column:2}.controls [data-dir=left]{grid-column:1}.muted{color:#9aaec4;font-size:14px}#message{min-height:26px;color:#71dfcd}.scoreboard{margin:18px 0;padding:14px;border:1px solid #425169;border-radius:12px}.scoreboard ol{margin:8px 0;padding-left:24px}@media(max-width:500px){main{padding:16px}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style>
<main><header><h1>工作看板</h1><button id="export">匯出 JSON</button></header><p>離線整理工作。資料儲存在此瀏覽器。</p><form id="add"><input id="title" required maxlength="120" placeholder="新增一件工作" aria-label="新工作"><button class="primary">新增</button></form><div class="bar"><input id="filter" placeholder="搜尋工作" aria-label="搜尋工作"><label>匯入 JSON <input id="import" type="file" accept=".json,application/json"></label></div><p id="message" role="status"></p><div id="board"></div></main>
<script>
"use strict";const key='meadow-kanban-v1',columns=['待辦','進行中','完成'];let tasks=[];try{const raw=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(raw))tasks=raw.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&columns.includes(t.status)).map(t=>({id:t.id,title:t.title.slice(0,120),status:t.status}));}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(tasks));document.querySelector('#message').textContent='已儲存';}catch(e){document.querySelector('#message').textContent='瀏覽器儲存不可用；可匯出保留資料';}render();}function render(){const board=document.querySelector('#board');board.replaceChildren();const query=document.querySelector('#filter').value.toLowerCase();for(const status of columns){const col=document.createElement('section');col.style.cssText='padding:16px;border:1px solid #425169;border-radius:12px;margin:12px 0';const heading=document.createElement('h2');heading.textContent=status+' · '+tasks.filter(t=>t.status===status).length;col.append(heading);for(const t of tasks.filter(t=>t.status===status&&t.title.toLowerCase().includes(query))){const row=document.createElement('article');row.dataset.id=t.id;row.style.cssText='display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0';const text=document.createElement('span');text.textContent=t.title;text.style.flex='1';const select=document.createElement('select');select.setAttribute('aria-label','移動 '+t.title);for(const s of columns){const o=document.createElement('option');o.value=o.textContent=s;select.append(o);}select.value=t.status;select.onchange=()=>{t.status=select.value;save();};const edit=document.createElement('button');edit.textContent='編輯';edit.onclick=()=>{const value=prompt('工作內容',t.title);if(value&&value.trim()){t.title=value.trim().slice(0,120);save();}};const remove=document.createElement('button');remove.textContent='刪除';remove.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();};row.append(text,select,edit,remove);col.append(row);}board.append(col);}}document.querySelector('#add').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#title'),title=input.value.trim();if(!title)return;tasks.push({id:crypto.randomUUID(),title,status:columns[0]});input.value='';save();};document.querySelector('#filter').oninput=render;document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='tasks.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.querySelector('#import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('file too large');const data=JSON.parse(await file.text());if(!Array.isArray(data)||data.length>1000||data.some(t=>!t||typeof t.title!=='string'||!columns.includes(t.status)))throw Error('invalid tasks');tasks=data.map(t=>({id:crypto.randomUUID(),title:t.title.slice(0,120),status:t.status}));save();}catch(e){document.querySelector('#message').textContent='無法匯入：請使用此看板匯出的 JSON';}};render();

</script></html>
