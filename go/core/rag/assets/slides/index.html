<!doctype html>
<html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究簡報</title><style>*{box-sizing:border-box}body{margin:0;background:#10151d;color:#edf3fa;font:16px/1.5 system-ui,sans-serif}main{width:min(720px,100%);margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:28px;letter-spacing:-.04em;margin:0}p{color:#a6b6c9}button,input,textarea,select{font:inherit}button{border:1px solid #425169;background:#233046;color:inherit;border-radius:10px;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #72dfd3}button:hover{background:#33445e}.primary{background:#71dfcd;color:#102720;border-color:transparent}.primary:hover{background:#98efde;color:#102720}canvas{display:block;width:100%;height:auto;border-radius:12px;background:#111b2b;touch-action:none}.bar{display:flex;justify-content:space-between;gap:12px;margin:16px 0;flex-wrap:wrap}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:14px auto}.controls button{padding:12px}.controls [data-dir=up]{grid-column:2}.controls [data-dir=left]{grid-column:1}.muted{color:#9aaec4;font-size:14px}#message{min-height:26px;color:#71dfcd}.scoreboard{margin:18px 0;padding:14px;border:1px solid #425169;border-radius:12px}.scoreboard ol{margin:8px 0;padding-left:24px}@media(max-width:500px){main{padding:16px}h1{font-size:24px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style>
<main id="deck"><header><h1>研究簡報</h1><button id="fullscreen">全螢幕</button></header><p>直接編輯每頁文字，預覽或列印為 PDF。</p><section id="slide" style="min-height:340px;padding:36px;border:1px solid #425169;border-radius:14px"><span id="eyebrow" class="muted"></span><h2 id="headline" contenteditable="true" aria-label="投影片標題" style="font-size:40px;line-height:1.15"></h2><p id="copy" contenteditable="true" aria-label="投影片內文" style="font-size:22px;color:#edf3fa"></p><p id="source" class="muted" contenteditable="true" aria-label="資料來源"></p></section><div class="bar"><button id="prev">上一頁</button><span id="position"></span><button id="next">下一頁</button></div><div class="bar"><button id="add">新增頁面</button><button id="download">下載 HTML</button><button id="print">列印 / PDF</button></div><p class="muted">← / → 換頁 · F 全螢幕。內容儲存於此瀏覽器。</p><div id="message" role="status"></div></main>
<script>
"use strict";const defaultSlides=[{title:'從資料到決策',body:'一份清楚的簡報，需要明確問題、可核對的證據，以及能採取的下一步。',source:'來源：請填入研究引用'},{title:'先說明關鍵發現',body:'將一個主要結論放在每一頁。使用短句和具體數字，保留足夠的視覺留白。',source:'來源：請填入資料網址'},{title:'帶著行動離開',body:'誰來做？何時完成？用什麼指標確認？',source:'來源：請填入相關文件'}];let slides=defaultSlides.map(s=>({...s})),index=0;try{const data=JSON.parse(localStorage.getItem('meadow-slides')||'null');if(Array.isArray(data)&&data.length&&data.every(s=>s&&['title','body','source'].every(k=>typeof s[k]==='string')))slides=data;}catch(e){}function persist(){try{localStorage.setItem('meadow-slides',JSON.stringify(slides));}catch(e){document.querySelector('#message').textContent='儲存不可用；請下載 HTML';}}function render(){const s=slides[index];document.querySelector('#eyebrow').textContent='MEADOW / '+String(index+1).padStart(2,'0');document.querySelector('#headline').textContent=s.title;document.querySelector('#copy').textContent=s.body;document.querySelector('#source').textContent=s.source;document.querySelector('#position').textContent=(index+1)+' / '+slides.length;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===slides.length-1;}for(const [id,key]of [['headline','title'],['copy','body'],['source','source']])document.querySelector('#'+id).oninput=e=>{slides[index][key]=e.target.textContent;persist();};function move(n){index=Math.max(0,Math.min(slides.length-1,index+n));render();}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#add').onclick=()=>{slides.push({title:'新頁面',body:'輸入重點內容',source:'來源：'});index=slides.length-1;persist();render();};async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.querySelector('#deck').requestFullscreen();}catch(e){document.querySelector('#message').textContent='此瀏覽器不支援全螢幕';}}document.querySelector('#fullscreen').onclick=fullscreen;addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key.toLowerCase()==='f')fullscreen();});function exportHTML(){const doc=document.implementation.createHTMLDocument('研究簡報'),style=document.createElement('style');style.textContent='body{font:24px/1.6 system-ui;background:#10151d;color:#edf3fa;margin:0}section{padding:8vw;min-height:100vh;box-sizing:border-box;page-break-after:always}h1{font-size:clamp(36px,6vw,80px);line-height:1.1;max-width:1000px}p{max-width:900px}small{color:#aac0d3}@media print{body{background:white;color:black}section{min-height:90vh}small{color:#405269}}';doc.head.append(style);slides.forEach((s,i)=>{const page=doc.createElement('section'),number=doc.createElement('small'),title=doc.createElement('h1'),body=doc.createElement('p'),source=doc.createElement('small');number.textContent='MEADOW / '+(i+1);title.textContent=s.title;body.textContent=s.body;source.textContent=s.source;page.append(number,title,body,source);doc.body.append(page);});return '<!doctype html>'+doc.documentElement.outerHTML;}document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([exportHTML()],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='presentation.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.querySelector('#print').onclick=()=>{const w=window.open('','_blank');if(!w){document.querySelector('#message').textContent='允許彈出視窗後再列印';return;}w.document.write(exportHTML());w.document.close();w.print();};window.meadowDeck={getSlides:()=>slides.map(s=>({...s})),exportHTML};render();

</script></html>
