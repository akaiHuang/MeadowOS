<!doctype html>
<html lang="zh-TW" data-account-access="locked">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Meadow</title>
    <script src="./js/production-guard.js"></script>
    <script src="./js/theme-bootstrap.js"></script>
    <!-- DM Sans＝TS index.html 同款 Google Fonts 載入（display=swap，離線時與 TS 相同地回退 -apple-system） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap"
    />
    <link rel="stylesheet" href="./style.css?v=mobile-reading-20260929a" />
    <link
      rel="stylesheet"
      href="./product_experience.css?v=welcome-benefits-20260928a"
    />
    <link
      rel="stylesheet"
      href="./css/onboarding-benefits.css?v=welcome-benefits-20260928a"
    />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/account_access.css" />
    <link rel="stylesheet" href="./css/run_limits.css" />
    <link rel="stylesheet" href="./css/task_todo.css?v=task-todo-20261004b" />
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <link rel="stylesheet" href="./css/mobile.css?v=mobile-reading-20260929a" />
    <link
      rel="stylesheet"
      href="./css/mobile-dialogs.css?v=mobile-effort-20260928a"
      data-mobile-dialog-styles
    />
    <link rel="stylesheet" href="./css/inference-controls.css?v=desktop-gauge-20260928b" />
    <link rel="stylesheet" href="./css/harness-controls.css?v=raven-execution-20261006a" />
    <link rel="stylesheet" href="./css/desktop-composer-toolbar.css?v=toolbar-align-20260928a" />
    <link rel="stylesheet" href="./vendor/leaflet-1.9.4.css" />
    <link rel="stylesheet" href="./css/nearby.css?v=nearby-reference-20260929a" />
    <link rel="stylesheet" href="./css/search-presentation.css?v=gauge-images-20260928a" />
    <link rel="stylesheet" href="./css/thinking-presentation.css?v=gauge-images-20260928a" />
    <link rel="stylesheet" href="./css/answer-presentation.css?v=gauge-images-20260928a" />
  </head>
  <body>
    <aside id="sidebar" inert data-account-locked>
      <div id="sideRail" aria-hidden="true">
        <button
          id="sideRailExpand"
          type="button"
          title="展開側欄"
          aria-label="展開側欄"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M9 3v18" />
          </svg>
        </button>
      </div>
      <!-- TS SidebarHeader: drag-region h-52 pl-90（紅綠燈讓位），只有這條與 #header 可拖動視窗 -->
      <!-- 拖動帶（紅綠燈讓位）；logo 移至 header 右側（用戶回饋） -->
      <div class="side-head"></div>

      <!-- TS SidebarContent 第一群組：新聊天（PlusIcon size-4 + flex-1 label + Kbd ⇧⌘N） -->
      <div class="side-sec">
        <button id="newChatBtn">
          <svg
            class="nc-ic"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.25"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="M12 5v14" /></svg
          ><span class="nc-lb">新聊天</span><kbd class="side-kbd">⇧⌘N</kbd>
        </button>
      </div>

      <!-- TS SidebarContent 第二群組：搜尋列（sidebar.js 填入；點擊＝⌘K 開 palette） -->
      <div class="side-sec">
        <div id="sideSearch"><!-- sidebar.js: 搜尋列掛載點 --></div>
      </div>

      <!-- TS SidebarContent 專案群組：區頭（「專案」標籤＋排序選單＋加資料夾 icon）＋清單。
       #wsRow/#wsName 為歷史掛載 id（保留、不再顯示）：「新增專案」入口改為
       #projHead 的 folder-plus 與 #sideFoot 的「選擇資料夾…」。 -->
      <div class="side-projects">
        <div id="projHead">
          <!-- sidebar.js: 專案區頭掛載點（排序選單＋加資料夾） -->
        </div>
        <div id="wsRow" hidden>
          <span class="ic">📁</span><span id="wsName">未選擇資料夾</span>
        </div>
        <div id="threadList">
          <!-- sidebar.js renders project groups + thread rows here -->
        </div>
      </div>

      <!-- TS SidebarFooter p-2：「選擇資料夾…」「設定」兩列（sidebar agent 填入） -->
      <div id="sideFoot"><!-- sidebar.js: 底部動作列掛載點 --></div>
    </aside>

    <main id="main" inert data-account-locked>
      <header id="header">
        <!-- TS ChatHeader.tsx 像素對齊：左群組（SidebarTrigger → 標題 → 專案 Badge → 輸出檔 tabs，sm:gap-3）
         ＋右群組（新增動作 / 開啟▾ / Publish▾ / 終端機 / 任務 / 右欄，gap-2）。設定鈕 TS 沒有，保留最右。
         既有 id 全保留：#threadTitle/#outTabs/#headerActions/#btnEditor/#gitArea/#btnTerminal/#btnProgress/#btnDiff/#btnSettings。
         分支膠囊改掛 composer 下方 #branchSlot（gitbar.js），#gitArea 留空容器、display:none。 -->
        <div id="headerLeft">
          <button
            class="hd-side"
            id="btnSideToggle"
            title="開關側欄"
            aria-label="開關側欄"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M9 3v18" />
            </svg>
          </button>
          <div id="threadTitle">新對話</div>
          <span id="projBadge" hidden></span>
          <div id="outTabs" role="tablist" aria-label="本次輸出檔案">
            <!-- outputtabs.js renders output-file tabs here -->
          </div>
        </div>
        <div id="headerRight">
          <div id="headerActions">
            <!-- gitbar.js 接線：新增動作 / 開啟▾ / Git 快速動作▾ -->
          </div>
          <div id="gitArea">
            <!-- 分支膠囊移至 composer #branchSlot；容器 id 保留（display:none） -->
          </div>
          <div id="logo">
            <svg
              class="logo-ic"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M1.5 9 C 4 5.5, 6.5 5.5, 9 9 C 11.5 12.5, 14 12.5, 16.5 9 C 19 5.5, 21.5 5.5, 22.5 7.5"
                transform="translate(0,2)"
              />
              <path
                d="M1.5 14 C 4 10.5, 6.5 10.5, 9 14 C 11.5 17.5, 14 17.5, 16.5 14 C 19 10.5, 21.5 10.5, 22.5 12.5"
                transform="translate(0,2)"
              /></svg
            ><span class="logo-t">Meadow <b>Code</b></span>
          </div>
          <button
            class="icon-btn"
            id="btnTerminal"
            title="切換終端機抽屜（⌘J）"
            aria-label="切換終端機抽屜"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m7 11 2-2-2-2" />
              <path d="M11 13h4" />
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnProgress"
            title="背景任務與研究來源"
            aria-label="開啟背景任務與研究來源"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M13 5h8" />
              <path d="M13 12h8" />
              <path d="M13 19h8" />
              <path d="m3 17 2 2 4-4" />
              <rect x="3" y="4" width="6" height="6" rx="1" /></svg
            ><span id="progressBadge" hidden></span>
          </button>
          <button
            class="icon-btn"
            id="btnExpertLens"
            title="專家透視（Beta）"
            aria-label="開啟專家透視"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
              />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnDiff"
            title="右側預覽"
            aria-label="Toggle preview sidebar"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M15 3v18" />
            </svg>
          </button>
          <button
            class="icon-btn"
            id="btnSettings"
            hidden
            title="設定"
            aria-label="設定"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>

      <div id="scroll">
        <div id="timeline"><!-- timeline.js renders turns here --></div>
      </div>

      <div id="composerWrap">
        <div id="pendingArea">
          <!-- approval / user-input cards mount here -->
        </div>
        <!-- 卡片＝TS ChatComposer surface：rounded-[20px]、border、bg-card、focus ring 綠 45%。
         placeholder 由 timeline agent 依 model 狀態覆寫（未載入=「請先選擇模型…（點左下的模型選單）」）；
         composer.js 絕不寫入 placeholder。 -->
        <!-- 新對話置中模式：資料夾 selector 在輸入框上方（開聊後隱藏，鎖定版回到下方） -->
        <div id="folderAbove" hidden>
          <button id="folderAboveBtn" title="選擇工作區資料夾">
            <span class="ic"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                /></svg
            ></span>
            <span id="folderAboveName">選擇資料夾</span>
            <svg
              class="cv"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
        </div>
        <section id="taskQueue" aria-label="排隊訊息" hidden></section>
        <section id="taskTodo" aria-label="任務與待辦" aria-live="polite" aria-busy="false" hidden></section>
        <form id="composer" data-file-drop-target>
          <!-- 拖放／貼上圖片的縮圖列（composer.js 填入；空時 :empty 隱藏） -->
          <div id="attachStrip">
            <!-- 圖片縮圖卡：48px 縮圖＋檔名＋✕ 移除 -->
          </div>
          <textarea
            id="input"
            rows="1"
            placeholder="輸入訊息…"
            aria-label="訊息"
            enterkeyhint="enter"
          ></textarea>
          <div id="composerFoot">
            <div id="composerLeft">
              <!-- One gauge opens the existing model / inference settings. -->
              <button
                class="pill inference-shortcut"
                id="pillModel"
                type="button"
                title="模型與推理設定"
                aria-label="模型與推理設定，Effort 讀取中"
                data-effort="unknown"
                data-effort-state="loading"
              >
                <span class="effort-gauge" aria-hidden="true">
                  <span class="effort-gauge-needle"></span>
                  <span class="effort-gauge-hub"></span>
                </span>
                <span id="pillModelName" class="effort-gauge-meta">請選擇模型</span>
                <output id="pillEffortValue" class="effort-gauge-meta">讀取中</output>
              </button>
              <input
                id="imageAttachInput"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,.pdf,.xlsx,.csv,.docx,.pptx,.txt,.md"
                multiple
                hidden
              />
              <button
                class="pill"
                id="attachImageBtn"
                type="button"
                title="附加圖片、PDF 或文件"
                aria-label="附加圖片、PDF 或文件"
              >
                <span class="ic" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"
                    />
                  </svg>
                </span>
              </button>
              <button
                class="pill"
                id="pillResearch"
                type="button"
                title="資料搜集模式"
                aria-label="資料搜集模式"
                aria-pressed="false"
              >
                <span class="ic" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="9" />
                    <path d="M3 12h18" />
                    <path d="M12 3a15 15 0 0 1 0 18" />
                    <path d="M12 3a15 15 0 0 0 0 18" />
                  </svg>
                </span>
              </button>
              <!-- 核准模式（approval：確認每步／自動編輯／全自動，文案同設定頁；icon 隨檔換，composer.js 維護） -->
              <button class="pill" id="pillMode" type="button" title="核准模式">
                <span class="ic"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg></span
                ><span id="pillModeName">確認每步</span
                ><svg
                  class="cv"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
            </div>
            <div id="composerRight">
              <div id="ctxMeter"><!-- context usage meter mounts here --></div>
              <!-- 互動模式（一般／規劃）緊鄰送出鈕：送出前順手選計畫或一般（用戶回饋） -->
              <button
                class="pill"
                id="pillInteract"
                type="button"
                title="互動模式"
              >
                <span class="ic"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M8 6h13" />
                    <path d="M8 12h13" />
                    <path d="M8 18h13" />
                    <path d="M3 6h.01" />
                    <path d="M3 12h.01" />
                    <path d="M3 18h.01" /></svg></span
                ><span id="pillInteractName">一般</span
                ><svg
                  class="cv"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </button>
              <button
                id="stopBtn"
                type="button"
                title="立即停止目前任務，不再請模型收尾；上游已產生的用量可能仍會計費"
                aria-label="停止生成"
                hidden
              >
                <span class="mobile-action-glyph" aria-hidden="true">■</span>
                <svg
                  class="desktop-action-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
                </svg>
              </button>
              <button
                id="sendBtn"
                type="submit"
                title="送出（⌘↩）"
                aria-label="送出訊息"
              >
                <span class="mobile-action-glyph" aria-hidden="true">↑</span>
                <svg
                  class="desktop-action-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
              </button>
            </div>
          </div>
        </form>
        <!-- 卡片下方一列：資料夾 pill（TS ComposerProjectPicker trigger 視覺）＋分支選單掛載點。
         gitbar.js 的分支 popover 觸發鈕由整合者掛進 #branchSlot（gitbar 檔案非本區塊，不在此改）。 -->
        <div id="checkoutRow">
          <button class="pill" id="pillFolder">
            <span class="ic"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                /></svg></span
            ><span id="pillFolderName">Local checkout</span>
          </button>
          <span id="checkoutRight">
            <span id="modelFoot" title="模型與目前執行狀態">
              <span id="modelDot"></span><span id="modelText">啟動中…</span>
            </span>
            <span id="branchSlot"
              ><!-- gitbar.js branch trigger mounts here --></span
            >
            <span id="licensePill" hidden title="Meadow Code 授權狀態"></span>
            <button
              id="memPill"
              hidden
              title="記憶體用量（點擊看明細）"
            ></button>
            <span id="usagePill" hidden title="本對話累計處理量，非帳單費用"></span>
          </span>
        </div>
        <div id="busy"></div>
      </div>

      <!-- M5-3 terminal drawer: tab strip + xterm panes, driven by js/terminal.js -->
      <div id="termDrawer" hidden>
        <div id="termDragbar" title="拖拉調整高度"></div>
        <div id="termTabs">
          <button id="termNew" title="新增終端機">＋</button>
        </div>
        <div id="termPanes"></div>
      </div>
    </main>

    <aside id="rightPanel" aria-hidden="true" inert data-account-locked>
      <!-- M7 右欄＝「輸出內容／進度」雙 tab，對齊 TS WorkspacePanel（FileListPanel）＋ ProgressSidebar；
       js/diffpanel.js 驅動。.open 滑開機制與 #diffPanel/#diffHead/#diffPath/#diffBody/
       #diffClose/#diffRollback id 全保留（e2e 與模組依賴）。 -->
      <div id="rpWrap">
        <div id="rpHead">
          <div id="rpTabs" role="tablist" aria-label="右側面板分頁">
            <button
              id="rpTabOut"
              class="rp-tab on"
              role="tab"
              aria-selected="true"
              aria-controls="rpPageOut"
            >
              輸出內容
            </button>
            <button
              id="rpTabProg"
              class="rp-tab"
              role="tab"
              aria-selected="false"
              aria-controls="rpPageProg"
            >
              進度
            </button>
          </div>
          <button id="diffClose" title="關閉" aria-label="關閉右側面板">
            ✕
          </button>
        </div>

                  fill="none"
                  stroke="currentColor"

                  stroke-linecap="round"

                  <path d="M14 2v4a2 2 0 0 0 2 2h4" />

                <span id="diffPath">尚未選取檔案</span>

              <div id="diffBody"></div>
            </div>
          </div>
        </div>

        <!-- 前景模型計畫與已記錄工具／背景工作分開顯示。 -->

          class="rp-page"
          role="tabpanel"
          aria-labelledby="rpTabProg"

          <section class="rp-sec" aria-labelledby="rpTaskTodoTitle">
            <h3 id="rpTaskTodoTitle" class="rp-sec-t">任務清單</h3>
            <div id="rpTaskTodo" aria-live="polite" aria-busy="false">
              <div class="rp-emptyrow">開啟對話後顯示模型的任務清單。</div>
            </div>
          </section>
          <section class="rp-sec">
            <h3 class="rp-sec-t">Agent 進度</h3>
            <div id="rpAgentActivity">
              <div class="rp-emptyrow">尚無工具進度</div>
            </div>
          </section>
          <section class="rp-sec">
            <h3 class="rp-sec-t">背景工作</h3>
            <div id="rpTasks">
              <div class="rp-emptyrow">目前沒有背景工作</div>
            </div>
          </section>
          <section class="rp-sec">
            <h3 class="rp-sec-t">輸出內容</h3>
            <div id="rpProgFiles"><div class="rp-emptyrow">尚無輸出</div></div>
          </section>
          <section class="rp-sec">
            <h3 class="rp-sec-t">瀏覽器</h3>

          <section class="rp-sec">

              <div class="rp-emptyrow">尚無研究來源</div>
            </div>
          </section>
        </div>
